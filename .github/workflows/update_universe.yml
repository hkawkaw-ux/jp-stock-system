name: Update Universe Snapshot

on:
  schedule:
    - cron: '0 22 * * *'   # 毎日 UTC 22:00 = JST 翌7:00
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update universe snapshot
        run: python scripts/update_universe_snapshot.py

      - name: Update watchlist signals
        run: python scripts/update_watchlist_signals.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/universe_snapshot.csv app/universe_snapshot_meta.json \
                  app/watchlist_signals.csv app/watchlist_signals_meta.json
          git diff --cached --quiet || git commit -m "chore: update universe snapshot and watchlist signals"
          git push
